name = "amigo-worker"
main = "src/index.ts"
compatibility_date = "2026-08-07"

[triggers]
crons = ["0 * * * *"] # Every hour

[[kv_namespaces]]
binding = "amigo"
id = "972c4dcd683e4d5696edddb7d0253423"

[ai]
binding = "AI"

[[workflows]]
name = "amigo-manual-run"
binding = "BOT_RUN_WORKFLOW"
class_name = "ManualBotRunWorkflow"




[vars]
# You can set non-sensitive variables here.
# Target Slovak Timezone
TIMEZONE = "Europe/Bratislava"
# Active hours limit: only send messages during these hours (local time)
START_HOUR = "9"
END_HOUR = "21"
SUBREQUESTS_LIMIT = "9000"

[[rules]]
globs = ["**/*.nano"]
type = "Text"
fallthrough = true

[observability.logs]
enabled = true
invocation_logs = true
